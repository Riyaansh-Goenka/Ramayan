<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Roster</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      color: var(--accent);
    }

    /* Tab Navigation Layout */
    .tab-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 2rem;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    .tab-btn {
      background-color: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }

    .tab-btn:hover {
      border-color: var(--accent);
      color: var(--text-main);
    }

    .tab-btn.active {
      background-color: var(--accent);
      color: #000;
      font-weight: bold;
      border-color: var(--accent);
    }

    /* Content Cards */
    .tab-content {
      display: none;
      max-width: 800px;
      margin: 0 auto;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .tab-content.active {
      display: block;
    }

    .character-card {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
    }

    @media (min-width: 600px) {
      .character-card {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    .image-placeholder {
      width: 200px;
      height: 200px;
      background-color: #0f172a;
      border: 2px dashed var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      flex-shrink: 0;
      object-fit: cover;
    }

    .character-info h2 {
      margin-bottom: 0.75rem;
      color: var(--accent);
    }

    .character-info p {
      color: var(--text-muted);
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>Character Showcase</h1>

  <div class="tab-nav" id="tabNav"></div>

  <div id="tabContents"></div>

  <script>
    const totalTabs = 33;
    const tabNav = document.getElementById('tabNav');
    const tabContents = document.getElementById('tabContents');

    // Generate 33 Tabs and Content Blocks dynamically
    for (let i = 1; i <= totalTabs; i++) {
      // Create Navigation Button
      const btn = document.createElement('button');
      btn.className = `tab-btn ${i === 1 ? 'active' : ''}`;
      btn.innerText = `Character ${i}`;
      btn.setAttribute('onclick', `openTab(event, 'tab-${i}')`);
      tabNav.appendChild(btn);

      // Create Content Area
      const content = document.createElement('div');
      content.id = `tab-${i}`;
      content.className = `tab-content ${i === 1 ? 'active' : ''}`;
      content.innerHTML = `
        <div class="character-card">
          <div class="image-placeholder">Photo Space ${i}</div>
          <div class="character-info">
            <h2>Character ${i}</h2>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>
          </div>
        </div>
      `;
      tabContents.appendChild(content);
    }

    // Switch Tabs Logic
    function openTab(evt, tabId) {
      const contents = document.querySelectorAll('.tab-content');
      contents.forEach(content => content.classList.remove('active'));

      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
    }
  </script>
</body>
</html>
