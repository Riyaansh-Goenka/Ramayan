<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramayan Characters</title>
  <style>
    :root {
      --bg-color: #fffbeb;
      --card-bg: #ffffff;
      --accent-orange: #d97706;
      --accent-yellow: #f59e0b;
      --accent-light: #fef3c7;
      --text-main: #451a03;
      --text-muted: #78350f;
      --border: #fcd34d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 1.5rem;
    }

    @media (min-width: 600px) {
      body {
        padding: 2.5rem;
      }
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--accent-orange);
      font-size: 1.8rem;
    }

    /* Universal Dropdown Styling */
    .dropdown-container {
      max-width: 500px;
      margin: 0 auto 2rem auto;
    }

    .character-select {
      width: 100%;
      padding: 0.85rem 1.2rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-main);
      background-color: var(--card-bg);
      border: 2px solid var(--accent-orange);
      border-radius: 10px;
      outline: none;
      box-shadow: 0 4px 10px rgba(217, 119, 6, 0.12);
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .character-select:focus {
      border-color: var(--accent-yellow);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.3);
    }

    /* Card Layout */
    .tab-content {
      display: none;
      max-width: 800px;
      margin: 0 auto;
      background-color: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(217, 119, 6, 0.15);
    }

    @media (min-width: 600px) {
      .tab-content {
        padding: 2rem;
      }
    }

    .tab-content.active {
      display: block;
    }

    .character-card {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
    }

    @media (min-width: 600px) {
      .character-card {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    .img-box {
      width: 100%;
      max-width: 220px;
      height: 220px;
      background-color: var(--accent-light);
      border: 2px dashed var(--accent-yellow);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      flex-shrink: 0;
      overflow: hidden;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .character-info {
      width: 100%;
    }

    .character-info h2 {
      margin-bottom: 0.75rem;
      color: var(--accent-orange);
    }

    .character-info p {
      color: var(--text-main);
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>Ramayan Characters</h1>

  <div class="dropdown-container">
    <select class="character-select" id="characterSelect" onchange="openTabFromSelect(this.value)">
    </select>
  </div>

  <div id="tabContents"></div>

  <script>
    const charactersData = [
      { name: "Character 1", image: "Character1.jpg", description: "This is character 1's Description" },
      { name: "Character 2", image: "Character2.jpg", description: "This is character 2's Description" },
      { name: "Character 3", image: "Character3.jpg", description: "This is character 3's Description" },
      { name: "Character 4", image: "Character4.jpg", description: "This is character 4's Description" },
      { name: "Character 5", image: "Character5.jpg", description: "This is character 5's Description" },
      { name: "Character 6", image: "Character6.jpg", description: "This is character 6's Description" },
      { name: "Character 7", image: "Character7.jpg", description: "This is character 7's Description" },
      { name: "Character 8", image: "Character8.jpg", description: "This is character 8's Description" },
      { name: "Character 9", image: "Character9.jpg", description: "This is character 9's Description" },
      { name: "Character 10", image: "Character10.jpg", description: "This is character 10's Description" },
      { name: "Character 11", image: "Character11.jpg", description: "This is character 11's Description" },
      { name: "Character 12", image: "Character12.jpg", description: "This is character 12's Description" },
      { name: "Character 13", image: "Character13.jpg", description: "This is character 13's Description" },
      { name: "Character 14", image: "Character14.jpg", description: "This is character 14's Description" },
      { name: "Character 15", image: "Character15.jpg", description: "This is character 15's Description" },
      { name: "Character 16", image: "Character16.jpg", description: "This is character 16's Description" },
      { name: "Character 17", image: "Character17.jpg", description: "This is character 17's Description" },
      { name: "Character 18", image: "Character18.jpg", description: "This is character 18's Description" },
      { name: "Character 19", image: "Character19.jpg", description: "This is character 19's Description" },
      { name: "Character 20", image: "Character20.jpg", description: "This is character 20's Description" },
      { name: "Character 21", image: "Character21.jpg", description: "This is character 21's Description" },
      { name: "Character 22", image: "Character22.jpg", description: "This is character 22's Description" },
      { name: "Character 23", image: "Character23.jpg", description: "This is character 23's Description" },
      { name: "Character 24", image: "Character24.jpg", description: "This is character 24's Description" },
      { name: "Character 25", image: "Character25.jpg", description: "This is character 25's Description" },
      { name: "Character 26", image: "Character26.jpg", description: "This is character 26's Description" },
      { name: "Character 27", image: "Character27.jpg", description: "This is character 27's Description" },
      { name: "Character 28", image: "Character28.jpg", description: "This is character 28's Description" },
      { name: "Character 29", image: "Character29.jpg", description: "This is character 29's Description" },
      { name: "Character 30", image: "Character30.jpg", description: "This is character 30's Description" },
      { name: "Character 31", image: "Character31.jpg", description: "This is character 31's Description" },
      { name: "Character 32", image: "Character32.jpg", description: "This is character 32's Description" },
      { name: "Character 33", image: "Character33.jpg", description: "This is character 33's Description" }
    ];

    const tabContents = document.getElementById('tabContents');
    const characterSelect = document.getElementById('characterSelect');

    charactersData.forEach((char, index) => {
      const tabId = `tab-${index + 1}`;

      // Populate Dropdown Options
      const option = document.createElement('option');
      option.value = tabId;
      option.innerText = char.name;
      characterSelect.appendChild(option);

      // Content Card
      const content = document.createElement('div');
      content.id = tabId;
      content.className = `tab-content ${index === 0 ? 'active' : ''}`;

      content.innerHTML = `
        <div class="character-card">
          <div class="img-box">
            <img src="${char.image}" alt="${char.name}" onerror="this.style.display='none'; this.parentNode.innerHTML='Photo Placeholder';">
          </div>
          <div class="character-info">
            <h2>${char.name}</h2>
            <p>${char.description}</p>
          </div>
        </div>
      `;
      tabContents.appendChild(content);
    });

    // Switch Character View
    function openTabFromSelect(tabId) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
    }
  </script>
</body>
</html>
